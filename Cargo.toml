[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/nagare-studio/mirona"

[workspace.dependencies]
mirona-core = { path = "crates/mirona-core" }
mirona-providers = { path = "crates/mirona-providers" }
mirona-store = { path = "crates/mirona-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
toml = "1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
