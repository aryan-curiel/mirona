# NGR-127: lint, test and build on macOS, Windows and Linux.
name: CI
on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # sherpa-onnx's build script downloads its native libs here; cache them with the
          # build outputs, or a restored cache skips the script and linking fails.
          cache-directories: target/sherpa-onnx-prebuilt
          prefix-key: v1-sherpa
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm lint
        working-directory: app
      - run: pnpm build
        working-directory: app
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: TS bindings are up to date
        shell: bash
        run: git diff --exit-code app/src/bindings
      - name: Debug build of the app
        run: pnpm tauri build --debug --no-bundle
        working-directory: app

  # Real providers (Parakeet, speakrs, Jev, Ollama) behind features. macOS only: speakrs
  # builds with CoreML. Tests that need models, an API key or Ollama are #[ignore]d here.
  providers:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # sherpa-onnx's build script downloads its native libs here; cache them with the
          # build outputs, or a restored cache skips the script and linking fails.
          cache-directories: target/sherpa-onnx-prebuilt
          prefix-key: v1-sherpa
      - run: cargo clippy -p mirona-providers --all-targets --all-features
      - run: cargo test -p mirona-providers --all-features

  tokens:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: App tokens match the design kit
        run: diff design-kit/tokens/tokens.css app/src/tokens.css
      - name: Text contrast >= 4.5:1 in both themes
        run: python3 design-kit/tokens/check-contrast.py
