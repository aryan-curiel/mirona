# NGR-176, NGR-178: the landing page (site/) at the root of https://mirona.app and the docs site
# (guides + Rust API) under docs/, deployed to Netlify. Built here, not on Netlify, since the
# API docs need Rust and the Linux libs below. Built on release tags and on demand only, to save
# Actions minutes. Needs the repo secrets NETLIFY_AUTH_TOKEN (Netlify › User settings ›
# Applications › Personal access tokens) and NETLIFY_SITE_ID (Site configuration › Site ID).
name: Docs
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: target/sherpa-onnx-prebuilt
          prefix-key: v1-sherpa
          save-if: false
      - name: sherpa-onnx native libs
        run: |
          v=$(awk '/name = "sherpa-onnx-sys"/{getline; print $3}' Cargo.lock | tr -d '"')
          n="sherpa-onnx-v$v-linux-x64-static-lib"
          mkdir -p "$RUNNER_TEMP/sherpa" && cd "$RUNNER_TEMP/sherpa"
          curl -fsSL -o "$n.tar.bz2" "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$v/$n.tar.bz2"
          tar xjf "$n.tar.bz2"
          echo "SHERPA_ONNX_LIB_DIR=$RUNNER_TEMP/sherpa/$n/lib" >> "$GITHUB_ENV"
      - name: Linux deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: mdBook
        run: |
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl -fsSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
      - run: scripts/build-docs.sh
      - run: scripts/build-site.sh
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@17.38.1 deploy --prod --dir target/site --message "${{ github.ref_name }}"
