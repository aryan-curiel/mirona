name: Idea
description: Suggest a feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: textarea
    id: privacy
    attributes:
      label: Privacy
      description: Would this send anything off the Mac, or need a new cloud service? Say so if it would.
