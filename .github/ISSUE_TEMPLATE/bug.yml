name: Bug
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Privacy or security problem (something leaving your Mac, a sensitive line in a summary)? Please report it privately instead: see SECURITY.md.
        Don't paste real meeting content.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a recording from the menu bar
        2. ...
  - type: input
    id: version
    attributes:
      label: Mirona version
      description: Settings › About
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 15.2, MacBook Air M2, 16 GB
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Privacy mode on or off, and the providers picked in Settings › AI models.
  - type: textarea
    id: logs
    attributes:
      label: Errors or logs
      render: text
