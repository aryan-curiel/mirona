[package]
name = "parakeet-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone: not a member of the root Mirona workspace.
[workspace]

[features]
whisper = ["dep:whisper-rs"]

[dependencies]
sherpa-onnx = "2.0.1"
hound = "3.5"
whisper-rs = { version = "0.16.0", features = ["metal"], optional = true }

[profile.release]
debug = false
