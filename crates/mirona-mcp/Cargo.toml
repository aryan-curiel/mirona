[package]
name = "mirona-mcp"
description = "Mirona's MCP server (stdio and localhost HTTP) over the meeting store"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "mirona-mcp"
path = "src/main.rs"

[dependencies]
mirona-core.workspace = true
mirona-store.workspace = true
mirona-engine.workspace = true
mirona-providers.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff = "0.2"
rmcp = { version = "3.9", features = [
  "server",
  "macros",
  "transport-io",
  "transport-streamable-http-server",
] }
tokio = { version = "1", features = ["rt", "io-std", "macros", "net", "sync"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
getrandom = "0.3"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"
ureq = "3"

[lints]
workspace = true
