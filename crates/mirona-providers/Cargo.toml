[package]
name = "mirona-providers"
version.workspace = true
edition.workspace = true
license.workspace = true

# Real providers are opt-in so the default build (and the fakes) stay light.
# Gate 0 defaults: ADR 0001.
[features]
jev = ["dep:ureq", "dep:serde_json"]
ollama = ["dep:ureq", "dep:serde_json"]
parakeet = ["dep:sherpa-onnx"]
speakrs = ["dep:speakrs"]
# Milestone 1 (owners in docs/m1-plan.md). Dependencies are added by the owner.
whisper = ["dep:whisper-rs"]
openai = ["dep:ureq", "dep:serde_json"]
anthropic = ["dep:ureq", "dep:serde_json"]
keychain = ["dep:keyring"]

[dependencies]
mirona-core.workspace = true
serde.workspace = true
toml.workspace = true
serde_json = { workspace = true, optional = true }
ureq = { version = "3", features = ["json"], optional = true }
sherpa-onnx = { version = "2.0.1", optional = true }
speakrs = { version = "=0.7.0", features = ["cpu"], optional = true }
whisper-rs = { version = "0.16.0", optional = true }
# macOS Keychain, Windows Credential Manager, Linux Secret Service (pure-Rust zbus: no libdbus).
keyring = { version = "3.6", features = ["apple-native", "windows-native", "async-secret-service", "crypto-rust", "async-io"], optional = true }

# Whisper runs on the GPU through Metal on macOS (ADR 0001).
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"], optional = true }
# speakrs diarizes with CoreML on macOS (≥ 16 GB RAM, ADR 0001); the CPU set runs everywhere.
speakrs = { version = "=0.7.0", features = ["coreml", "cpu"], optional = true }

[dev-dependencies]
hound = "3.5"
serde_json.workspace = true

[lints]
workspace = true
