[package]
name = "mirona-cli"
description = "Mirona from the terminal: record, import, search and the MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mirona"
path = "src/main.rs"

[dependencies]
mirona-core.workspace = true
mirona-store.workspace = true
mirona-engine.workspace = true
mirona-capture.workspace = true
mirona-mcp = { path = "../mirona-mcp" }
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5"

[dev-dependencies]
mirona-providers.workspace = true
tempfile = "3"

[lints]
workspace = true
